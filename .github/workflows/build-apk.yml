name: Compilar y publicar Morse Luz Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Comprobar JavaScript y archivos de la aplicacion
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/*.js; do
            node --check "$file"
          done
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/es/morseluz/app/MainActivity.java
          echo "JavaScript y archivos principales correctos."

      - name: Probar protocolo de comunicacion
        run: node --test tests/*.test.cjs

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encuentra sdkmanager en $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK de pruebas
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK de la compilacion
        uses: actions/upload-artifact@v4
        with:
          name: Morse-Luz-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # GitHub Releases conserva una version descargable de cada versionName.
      # Una nueva version se publica al incrementar versionName/versionCode.
      - name: Publicar version de pruebas en GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName invalido: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La version $TAG ya esta publicada; el APK de esta compilacion esta disponible en Artifacts."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Morse Luz para Android. Compilacion de pruebas generada automaticamente con GitHub Actions.

          Funciones: emision y recepcion de Morse mediante luz y sonido, velocidad ajustable, pulsador manual, historial y analisis de grabaciones.

          **Importante:** APK de depuracion (debug), destinado a pruebas. La linterna, camara, microfono y recepcion automatica requieren validacion en dispositivos reales. No es una version firmada para Google Play.
          NOTES
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#Morse-Luz-${VERSION}-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Morse Luz ${VERSION} (pruebas)" \
            --notes-file release-notes.md \
            --prerelease
