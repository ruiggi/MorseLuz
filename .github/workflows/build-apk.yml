name: Compilar APK Morse Luz 2.0
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de depuracion
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Morse-Luz-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
